<!-- Top Navigation (Shell suppressed for Transactional/Onboarding focus) -->

<span class="font-label-md text-label-md tracking-wider uppercase">Experience</span>
</div>

<p class="text-on-surface-variant font-body-md mb-gutter flex-grow">
                        Discover authentic cultural dishes prepared by passionate home chefs in your neighborhood.
                    </p>
<div class="flex items-center text-primary font-label-md group-hover:gap-4 gap-2 transition-all">
<span>Start Browsing</span>
<span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
</div>
</div>
</button>
<!-- I want to Cook -->
<button class="group relative flex flex-col text-left bg-surface-container-lowest border border-outline-variant rounded-xl overflow-hidden card-hover transition-all duration-300">
<div class="h-48 overflow-hidden">
<img class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" data-alt="A professional home chef with a warm smile preparing fresh ingredients on a wooden countertop. The kitchen is modern yet cozy, filled with stainless steel utensils and fresh herbs in terracotta pots. Soft ambient lighting highlights the texture of the vegetables and the craftsmanship of the cooking environment, embodying the Freshtively spirit of authentic culinary heritage." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDPs5VZVnfcLyXWVrlC3COuL0uSfb0uN7zdQ_znZg66j23tghSXVoNDxbZQArs-DRYmjJHurrilKDs0alqKyZNFg2rN-3pX5A5fQS_Slorr7szcM-vJZpeHX9VUAHVESkz2nBGSjgKjlhQCXDEDOwY3b0bXSv7OadcrLYpUZu_zuon-fayaY-zXxuBCogCMO8OvjSahGS834Y0T_NY5r-mk9sVkFkh7XN3CFwR4Ksr5jds097zq5dU3jhsbkH6q7NehqCzuvGXBxDA"/>

<span>Open Your Kitchen</span>
<span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
</div>

<p class="text-on-surface-variant font-body-md mb-gutter flex-grow">

<span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
