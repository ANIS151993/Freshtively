        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .splash-gradient {
            background: radial-gradient(circle at center, #10b981 0%, #006c49 100%);
        }
        /* Custom spinner rotation logic without external JS/Animation instructions */
        @keyframes custom-spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .animate-custom-spin {
            animation: custom-spin 1.2s linear infinite;

<!-- Splash Screen Container -->
<main class="splash-gradient min-h-screen w-full flex flex-col items-center justify-center relative px-margin-mobile md:px-margin-desktop overflow-hidden">
<!-- Decorative Background Elements -->
<div class="absolute inset-0 opacity-10 pointer-events-none">

<!-- Logo Concept: Leaf, Pot, Home Cluster -->
<div class="mb-12 flex flex-col items-center">
<div class="relative w-48 h-48 md:w-56 md:h-56 flex items-center justify-center">
<!-- Geometric Logo Base -->
<div class="absolute inset-0 bg-on-primary/10 rounded-full blur-3xl"></div>
<div class="relative flex items-center justify-center">
<!-- Pot Icon (Core) -->
<div class="bg-white p-6 rounded-full shadow-2xl z-20 transform -translate-y-2">
<span class="material-symbols-outlined text-primary text-[80px] md:text-[100px]" data-icon="cooking">cooking</span>
</div>
<!-- Leaf Icon (Organic Detail) -->
<div class="absolute -top-4 -right-4 bg-primary-container p-4 rounded-full shadow-xl z-30 transform rotate-12">
<span class="material-symbols-outlined text-on-primary-container text-[40px] md:text-[48px]" data-icon="eco" data-weight="fill" style="font-variation-settings: 'FILL' 1;">eco</span>
</div>
<!-- Home Icon (Community Detail) -->
<div class="absolute -bottom-2 -left-6 bg-secondary-container p-4 rounded-full shadow-xl z-10 transform -rotate-12">
<span class="material-symbols-outlined text-on-secondary-container text-[32px] md:text-[40px]" data-icon="house" data-weight="fill" style="font-variation-settings: 'FILL' 1;">house</span>
</div>
</div>
</div>
<!-- Brand Name -->
<h1 class="mt-8 font-display-lg text-display-lg text-white tracking-tight">
                    Freshtively
                </h1>
</div>
<!-- Slogan Section -->
<div class="space-y-4 px-4">
<p class="font-headline-md text-headline-md text-primary-fixed leading-snug">
                    Authentic Homemade Cultural Food, Delivered Fresh.
                </p>
<p class="font-body-lg text-body-lg text-on-primary/80 max-w-md mx-auto">
                    Connecting you to the warmth of a neighbor's kitchen through every flavorful delivery.
                </p>
</div>
<!-- Circular Loading Spinner -->
<div class="mt-16 flex flex-col items-center gap-4">
<div class="relative flex items-center justify-center">
<!-- Outer Ring -->
<div class="w-12 h-12 rounded-full border-4 border-on-primary/20"></div>
<!-- Spinning Segment -->
<div class="absolute w-12 h-12 rounded-full border-4 border-t-inverse-primary border-r-transparent border-b-transparent border-l-transparent animate-custom-spin"></div>
</div>
<span class="font-label-md text-label-md text-on-primary/60 tracking-widest uppercase">
                    Preparing the feast...
                </span>
</div>
</div>
<!-- Bottom Brand Mark / Attribution -->
<div class="absolute bottom-12 flex flex-col items-center">
<div class="flex gap-4 mb-2">
<span class="material-symbols-outlined text-on-primary/40" data-icon="verified_user">verified_user</span>
<span class="material-symbols-outlined text-on-primary/40" data-icon="favorite">favorite</span>
<span class="material-symbols-outlined text-on-primary/40" data-icon="spa">spa</span>
</div>
<p class="font-label-md text-label-md text-on-primary/40">
